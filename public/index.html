<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Purstream</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#121118">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Purstream">
  <meta name="application-name" content="Purstream">
  <meta name="msapplication-TileColor" content="#121118">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121118;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    /* Splash Screen Initial */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1c182a 0%, #121118 70%);
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .app-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      margin-bottom: 24px;
      box-shadow: 0 12px 35px rgba(226, 73, 102, 0.35);
      animation: pulseLogo 2s infinite ease-in-out;
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #e24966;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.95rem;
      color: #9ba1b0;
      letter-spacing: 0.3px;
    }

    .domain-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 5px 12px;
      border-radius: 20px;
      margin-top: 18px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
    }

    /* Fullscreen App Frame */
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #121118;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="/android-chrome-192x192.png" alt="Purstream" class="app-icon">
    <div class="spinner"></div>
    <p class="loading-text" id="status-text">Lancement de Purstream...</p>
    <div class="domain-badge" id="domain-badge">
      <span class="dot"></span>
      <span id="domain-text">purstream.ad</span>
    </div>
    <a id="direct-btn" href="https://purstream.ad/" target="_blank" style="display: none; margin-top: 24px; color: #e24966; text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border: 1px solid rgba(226, 73, 102, 0.4); border-radius: 8px;">Ouvrir directement ↗</a>
  </div>

  <iframe id="app-frame"
          allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *; web-share *"
          allowfullscreen="true"
          webkitallowfullscreen="true"
          mozallowfullscreen="true">
  </iframe>

  <script>
    // Enregistrement du Service Worker pour installation PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    const DEFAULT_URL = 'https://purstream.ad/';
    const frame = document.getElementById('app-frame');
    const splash = document.getElementById('splash');
    const statusText = document.getElementById('status-text');
    const domainText = document.getElementById('domain-text');
    const directBtn = document.getElementById('direct-btn');

    function hideSplash() {
      if (!splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
      }
    }

    // Afficher le bouton de secours si la connexion est trop lente (au bout de 3.5s)
    setTimeout(() => {
      if (!splash.classList.contains('hidden')) {
        directBtn.style.display = 'inline-block';
      }
    }, 3500);

    async function init() {
      // 1. Récupérer immédiatement la dernière URL connue (ou par défaut purstream.ad)
      let currentUrl = DEFAULT_URL;
      try {
        const cached = localStorage.getItem('purstream_active_url');
        if (cached && cached.startsWith('http')) {
          currentUrl = cached;
        }
      } catch (e) {}

      // Mettre à jour l'affichage
      try {
        domainText.textContent = new URL(currentUrl).hostname;
        directBtn.href = currentUrl;
      } catch (e) {}

      // 2. Pré-charger immédiatement l'iframe sans attendre l'API !
      frame.src = currentUrl;

      // 3. Cacher le splash dès que le site commence à charger
      frame.onload = () => {
        setTimeout(hideSplash, 300);
      };
      // Sécurité maximale : disparait quoi qu'il arrive après 1.8s
      setTimeout(hideSplash, 1800);

      // 4. Vérifier en arrière-plan si le domaine officiel a changé
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        const res = await fetch('/api/status', { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data && data.url && data.url !== currentUrl) {
            console.log('Nouveau domaine officiel détecté:', data.url);
            localStorage.setItem('purstream_active_url', data.url);
            domainText.textContent = new URL(data.url).hostname;
            directBtn.href = data.url;
            frame.src = data.url;
          }
        }
      } catch (err) {
        console.warn("Vérification d'URL en tâche de fond terminée:", err);
      }
    }

    init();
  </script>
</body>
</html>
